<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="tyten-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#7000FF" />
      <stop offset="100%" stop-color="#00FFA3" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Outer Hexagonal / Titan Shield -->
  <polygon points="32,4 56,18 56,46 32,60 8,46 8,18" stroke="url(#tyten-grad)" stroke-width="2.5" fill="#0A0D14" filter="url(#glow)" />
  <!-- Inner Neural Core Geometry (T shape with neural nodes) -->
  <path d="M20 22 H44 M32 22 V46" stroke="url(#tyten-grad)" stroke-width="3.5" stroke-linecap="round" />
  <circle cx="20" cy="22" r="3" fill="#00F0FF" />
  <circle cx="44" cy="22" r="3" fill="#7000FF" />
  <circle cx="32" cy="46" r="3.5" fill="#00FFA3" />
  <circle cx="32" cy="22" r="4" fill="#FFFFFF" />
</svg>
